[pytest]
pythonpath = .
asyncio_default_fixture_loop_scope = function
# silero/spacy deps pull a hydra-core 1.0.x pytest plugin that crashes on
# Python 3.12; disable it (it is unrelated to the project's tests).
addopts = -p no:hydra_pytest
markers =
    integration: requires local model weights, network access or heavy optional deps