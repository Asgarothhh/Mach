[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mts-rag"
version = "0.1.0"
description = "Retrieval building blocks for the MTS voice agent knowledge base: RRF fusion, metadata filters, evidence status and an in-memory lexical KnowledgeRetriever stub."
requires-python = ">=3.12"
dependencies = [
    "mts-contracts-knowledge>=0.1.0,<0.2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
qdrant = [
    "httpx>=0.25",
]
onnx = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mts_rag" = ["py.typed"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "onnxruntime",
    "onnxruntime.*",
    "tokenizers",
    "tokenizers.*",
    "redis",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--import-mode=importlib"
markers = [
    "integration: requires Qdrant, ONNX weights or other optional runtime deps",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Russian lexicon: Cyrillic words like "ага" are flagged as Latin look-alikes.
"src/mts_rag/lexical.py" = ["RUF001"]
"tests/test_term_normalization.py" = ["S101", "RUF001"]
"tests/test_paraphrase_retrieval.py" = ["S101", "RUF001"]
