version: '3.8'

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  prom_data:

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["demo"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      VOICE_ASR_MODE: ${VOICE_ASR_MODE:-mock}
      VOICE_TTS_MODE: ${VOICE_TTS_MODE:-mock}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-123789}@postgres:5432/${POSTGRES_DB:-voice_agent}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-123789}@postgres:5432/${POSTGRES_DB:-voice_agent}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-bge-m3-onnx}
      RERANKER_MODEL_ID: ${RERANKER_MODEL_ID:-none}
    volumes:
      - ./models/rag:/app/models/rag:ro
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  voice_agent:
    build:
      context: .
      dockerfile: apps/voice_agent/Dockerfile
    profiles: ["demo"]
    env_file:
      - .env
    environment:
      VOICE_ASR_MODE: ${VOICE_ASR_MODE:-mock}
      VOICE_TTS_MODE: ${VOICE_TTS_MODE:-mock}
      VOICE_AGENT_PORT: "8100"
    ports:
      - "8100:8100"
    restart: unless-stopped
    depends_on:
      - api
      - redis

  ingestion:
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
    profiles: ["demo"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: "false"
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_LIVEKIT_URL: ""
        VITE_APP_NAME: MTS Inbound Voice Agent
        VITE_BACKEND_TEXT_TEST: "true"
        VITE_BACKEND_ADMIN_SESSIONS: "false"
        VITE_BACKEND_TEST_TENANT_ID: acme-it-demo
    profiles: ["demo"]
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - api

  postgres:
    image: postgres:15-alpine
    profiles: ["demo"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123789}
      POSTGRES_DB: ${POSTGRES_DB:-voice_agent}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Host :5432 is often a local Postgres without the demo admin role.
      # Publish the compose database on 5433 so host uvicorn can reach it
      # without docker compose down -v and without touching the local cluster.
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["demo"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    profiles: ["demo"]
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.45.0
    profiles: ["demo"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
