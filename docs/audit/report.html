}
function issues(list, cols) { return `<ol class="issues${cols ? ' cols' : ''}">${list.map(([n, id, p, t, d], i) => `<li><i>${n}</i><div><span class="id ${p === 'P1' ? 'p1' : 'p2'}">${id} · ${p}</span><b>${t}</b> ${d}</div></li>`).join('')}</ol>`; }
