[project]
name = "mts-inbound-voice-agent"
version = "0.1.0"
description = "MTS inbound voice agent (track 1): local speech cascade, tenant-scoped RAG, guardrails"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
tts = ["torch>=2.4"]
vad = ["silero-vad>=5.1", "torch>=2.4"]
asr = ["faster-whisper>=1.1", "sherpa-onnx>=1.10"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires local model weights, network access or heavy optional deps",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
